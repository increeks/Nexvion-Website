name: Validate and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test the publication boundary
        run: python3 -m unittest discover -s tests -v

      - name: Package public files
        run: python3 scripts/package_site.py --output dist --revision "$GITHUB_SHA"

      - name: Publish to nexvionnet.com
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NEXVION_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NEXVION_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/nexvion_deploy_key"
          host_file="$RUNNER_TEMP/nexvion_known_hosts"
          trap 'rm -f "$key_file" "$host_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$host_file"
          export RSYNC_RSH="ssh -p 5726 -i $key_file -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$host_file -o ConnectTimeout=20"
          rsync -rz --delay-updates --delete-delay --omit-dir-times \
            --exclude='/.well-known/' --exclude='/.user.ini' --exclude='/php.ini' \
            dist/ nexvion-deploy@45.248.60.71:./

      - name: Verify the public release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "https://nexvionnet.com/version.json?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/live-version.json"
          cmp dist/version.json "$RUNNER_TEMP/live-version.json"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "https://nexvionnet.com/?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/live-index.html"
          cmp dist/index.html "$RUNNER_TEMP/live-index.html"
          printf 'Verified https://nexvionnet.com at commit %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
